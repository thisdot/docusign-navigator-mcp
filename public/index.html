<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>DocuSign Navigator MCP Server (Deprecated) - This Dot Labs</title>
    <meta name="title" content="DocuSign Navigator MCP Server (Deprecated) - This Dot Labs">
    <meta name="description" content="The DocuSign Navigator MCP Server by This Dot Labs is deprecated. Use the official Docusign MCP Server instead.">
    <meta name="robots" content="noindex, follow">
    <meta name="author" content="This Dot Labs">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://docusign-navigator.thisdot.co/">
    <meta property="og:title" content="DocuSign Navigator MCP Server (Deprecated)">
    <meta property="og:description" content="This server is deprecated. Use the official Docusign MCP Server instead.">
    <meta property="og:site_name" content="DocuSign Navigator MCP by This Dot Labs">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:title" content="DocuSign Navigator MCP Server (Deprecated)">
    <meta property="twitter:description" content="This server is deprecated. Use the official Docusign MCP Server instead.">

    <meta name="theme-color" content="#b00020">

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-primary: #ffffff;
            --color-accent: #FF5252;
            --color-bg: #000000;
            --color-bg-card: #0a0a0a;
            --color-border: #1a1a1a;
            --color-text-muted: #b3b3b3;

            --font-header: 'Space Grotesk', monospace;
            --font-body: 'JetBrains Mono', monospace;

            --transition: all 0.15s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            line-height: 1.4;
            color: var(--color-primary);
            background: var(--color-bg);
            font-weight: 400;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Subtle grid pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 60px 20px;
            background: var(--color-bg-card);
            border: 2px solid var(--color-border);
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--color-accent);
        }

        .header h1 {
            font-family: var(--font-header);
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 15px;
            line-height: 0.9;
            color: var(--color-primary);
        }

        .header .subtitle {
            font-family: var(--font-header);
            font-size: clamp(1rem, 3vw, 1.5rem);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--color-accent);
            font-weight: 600;
        }

        .section {
            margin-bottom: 30px;
            background: var(--color-bg-card);
            border: 2px solid var(--color-accent);
            overflow: hidden;
        }

        .section-header {
            background: var(--color-bg);
            color: var(--color-accent);
            padding: 25px 30px;
            font-family: var(--font-header);
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            border-bottom: 2px solid var(--color-border);
        }

        .section-content {
            padding: 30px;
            color: var(--color-text-muted);
            font-size: clamp(0.85rem, 2vw, 1rem);
        }

        .section-content p {
            margin-bottom: 20px;
        }

        .links {
            display: grid;
            gap: 15px;
        }

        .link {
            display: block;
            background: var(--color-bg);
            color: var(--color-primary);
            padding: 20px;
            font-family: var(--font-header);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-decoration: none;
            border: 2px solid var(--color-border);
            border-left: 3px solid var(--color-accent);
            transition: var(--transition);
            word-break: break-word;
        }

        .link:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 15px;
            }

            .header {
                padding: 40px 20px;
            }

            .section-content {
                padding: 25px 20px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 10px;
            }

            .header {
                padding: 30px 15px;
            }

            .section-header,
            .section-content {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DOCUSIGN<br>NAVIGATOR</h1>
            <p class="subtitle">MCP SERVER · DEPRECATED</p>
            <div style="margin-top: 30px; display: flex; align-items: center; justify-content: center; gap: 15px;">
                <p class="subtitle" style="margin: 0; font-size: clamp(0.8rem, 2vw, 1rem);">BY</p>
                <img src="/thisdot-labs-logo.png" alt="This Dot Labs" style="height: clamp(30px, 5vw, 50px); width: auto;">
            </div>
        </div>

        <div class="section">
            <div class="section-header">THIS SERVER IS BEING SHUT DOWN</div>
            <div class="section-content">
                <p>This project is no longer maintained. Use the official Docusign MCP Server instead.</p>
                <div class="links">
                    <a class="link" href="https://developers.docusign.com/platform/mcp-server/">Docusign MCP Server documentation →</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
